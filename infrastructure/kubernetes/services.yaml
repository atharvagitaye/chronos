apiVersion: v1
kind: Service
metadata:
  name: chronos-api
  namespace: chronos
spec:
  selector:
    app: chronos-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-worker
  namespace: chronos
spec:
  selector:
    app: chronos-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
