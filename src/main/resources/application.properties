spring.application.name=chronos

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chronos}
spring.datasource.username=${DATABASE_USERNAME:chronos}
spring.datasource.password=${DATABASE_PASSWORD:chronos}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:chronos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:chronos}
chronos.outbox.publisher.enabled=${CHRONOS_OUTBOX_PUBLISHER_ENABLED:true}
chronos.outbox.publisher.interval-ms=${CHRONOS_OUTBOX_PUBLISHER_INTERVAL_MS:1000}
