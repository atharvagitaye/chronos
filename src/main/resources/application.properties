spring.application.name=chronos
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chronos}
spring.datasource.username=${DATABASE_USERNAME:chronos}
spring.datasource.password=${DATABASE_PASSWORD:chronos}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:chronos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:chronos}
chronos.outbox.publisher.enabled=${CHRONOS_OUTBOX_PUBLISHER_ENABLED:true}
chronos.outbox.publisher.interval-ms=${CHRONOS_OUTBOX_PUBLISHER_INTERVAL_MS:1000}
chronos.worker.enabled=${CHRONOS_WORKER_ENABLED:true}
chronos.worker.concurrency=${CHRONOS_WORKER_CONCURRENCY:4}
chronos.retry.base-delay-ms=${CHRONOS_RETRY_BASE_DELAY_MS:2000}
chronos.retry.max-delay-ms=${CHRONOS_RETRY_MAX_DELAY_MS:30000}
chronos.worker.lease-recovery-interval-ms=${CHRONOS_WORKER_LEASE_RECOVERY_INTERVAL_MS:10000}
chronos.scheduler.interval-ms=${CHRONOS_SCHEDULER_INTERVAL_MS:1000}
chronos.mode=${CHRONOS_MODE:all}
